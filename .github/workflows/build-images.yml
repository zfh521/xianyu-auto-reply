# 闲鱼自动回复系统 - Docker 镜像构建流水线
#
# 构建 4 个应用镜像并推送到镜像仓库：
#   - xianyu-backend-web  (Python 3.11 + Playwright)
#   - xianyu-websocket    (Python 3.11 + Playwright)
#   - xianyu-scheduler    (Python 3.11 + Playwright)
#   - xianyu-frontend     (Node 18 编译 + nginx 运行)
#
# 触发条件：
#   - 推送到 main 分支：打 latest + sha 标签
#   - 推送 v* 标签：打 版本号 + sha 标签
#   - 手动触发：可自定义标签
#
# 默认推送到 GitHub Container Registry (ghcr.io)，使用内置 GITHUB_TOKEN 认证，无需额外配置 Secrets。
# 镜像地址形如 ghcr.io/<owner>/xianyu-backend-web:latest
#
# 切换到阿里云镜像仓库时（仓库 Settings → Secrets and variables → Actions）：
#   Variables:
#     - IMAGE_REGISTRY  设为 registry.cn-shanghai.aliyuncs.com/zhinian-software
#   Secrets:
#     - REGISTRY_USERNAME  阿里云仓库用户名
#     - REGISTRY_PASSWORD  阿里云仓库密码/AccessToken
#   Variables（可选）:
#     - IMAGE_PLATFORMS  目标平台（默认 linux/amd64，多架构用逗号分隔如 linux/amd64,linux/arm64）

name: Build Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '自定义镜像标签（留空则按分支/标签规则自动生成）'
        required: false
        default: ''
      no_cache:
        description: '禁用构建缓存（全量重新构建）'
        type: boolean
        required: false
        default: false

env:
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
  IMAGE_PLATFORMS: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    # 同一镜像同分支并发构建时只保留最新一次
    concurrency:
      group: build-${{ matrix.image }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: xianyu-backend-web
            dockerfile: backend-web/Dockerfile
          - image: xianyu-websocket
            dockerfile: websocket/Dockerfile
          - image: xianyu-scheduler
            dockerfile: scheduler/Dockerfile
          - image: xianyu-frontend
            dockerfile: docker/frontend/Dockerfile
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析仓库地址
        id: reg
        run: |
          REGISTRY="${{ env.IMAGE_REGISTRY }}"
          # 提取 host（第一个 / 之前的部分，用于 docker login）
          echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
          if [[ "${REGISTRY}" == ghcr.io/* ]]; then
            echo "is_ghcr=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_ghcr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 GitHub Container Registry
        if: steps.reg.outputs.is_ghcr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录自定义镜像仓库
        if: steps.reg.outputs.is_ghcr == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 生成镜像标签与缓存引用
        id: meta
        run: |
          REGISTRY="${{ env.IMAGE_REGISTRY }}"
          IMAGE="${{ matrix.image }}"
          FULL="${REGISTRY}/${IMAGE}"
          TAGS="${FULL}:sha-${GITHUB_SHA::7}"

          # main 分支 → latest
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${FULL}:latest"
          fi

          # v* 标签 → 版本号（如 v1.2.3）
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="${TAGS},${FULL}:${{ github.ref_name }}"
          fi

          # 手动触发自定义标签
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAGS="${TAGS},${FULL}:${{ inputs.image_tag }}"
          fi

          echo "tags=${TAGS}"        >> "$GITHUB_OUTPUT"
          echo "cache=${FULL}:cache" >> "$GITHUB_OUTPUT"
          echo "full=${FULL}"        >> "$GITHUB_OUTPUT"
          echo ""
          echo "📦 镜像: ${FULL}"
          echo "🏷️  标签: ${TAGS}"

      # 多架构构建需要 QEMU；单架构 amd64 时会自动跳过模拟
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: ${{ inputs.no_cache || false }}
          # 仓库内构建缓存，加速后续构建（首次较慢，之后命中缓存）
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.cache }},mode=max
          # 关闭 provenance attestation，兼容老版本 docker 客户端拉取
          provenance: false

      - name: 构建结果
        run: |
          echo "✅ ${{ matrix.image }} 构建并推送完成"
          echo "   ${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/   - /'
